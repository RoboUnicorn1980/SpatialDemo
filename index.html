The most common reasons the prompt isn't triggering:

* **Missing Transient User Activation (User Gesture):** WebXR requires a direct user interaction (such as a `click` or `touchend` event) to call `navigator.xr.requestSession('immersive-vr')` or `'immersive-ar'`. Browsers reject calls made automatically during page load or inside non-user event callbacks.
* **Insecure Context (HTTP vs. HTTPS):** WebXR APIs are only exposed in secure contexts. If you are serving the page over local HTTP without SSL, `navigator.xr` may be undefined or reject session requests. Localhost (`http://localhost` or `http://127.0.0.1`) is treated as secure, but accessing via a local IP (e.g., `http://192.168.x.x`) requires HTTPS or an SSL certificate/tunnel.
* **Session Support Check Failed:** If your code checks `navigator.xr.isSessionSupported('immersive-vr')` before rendering an "Enter VR" button, it might be returning `false`. This happens if:
  * No compatible headset/runtime is detected by the browser.
  * The required flags in `chrome://flags` or browser settings aren't enabled.
  * You are testing in an emulator or desktop browser without a mock OpenXR runtime.
